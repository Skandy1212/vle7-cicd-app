apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-data
  namespace: vle7
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup
  namespace: vle7
  labels: { app.kubernetes.io/part-of: vle7, vle7/role: backup, vle7/name: backup }
spec:
  replicas: 1
  strategy:
    type: Recreate          # one writer on the volume: never run two backup pods at once
  selector:
    matchLabels: { vle7/name: backup }
  template:
    metadata:
      labels: { app.kubernetes.io/part-of: vle7, vle7/role: backup, vle7/name: backup }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          env:
            - { name: ROLE, value: backup }
            - { name: PORT, value: "3000" }
            - { name: DATA_DIR, value: /data }
            - { name: NODE_ENV, value: production }
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
          envFrom:
            - secretRef: { name: vle7-secrets }
          ports: [{ containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /healthz, port: 3000 }, periodSeconds: 2, failureThreshold: 2 }
          livenessProbe: { httpGet: { path: /livez, port: 3000 }, periodSeconds: 10, failureThreshold: 3 }
          resources:
            requests: { cpu: 20m, memory: 48Mi }
            limits: { cpu: 300m, memory: 160Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: backup-data }
---
apiVersion: v1
kind: Service
metadata:
  name: backup
  namespace: vle7
spec:
  selector: { vle7/name: backup }
  ports: [{ port: 3000, targetPort: 3000 }]
