apiVersion: apps/v1
kind: Deployment
metadata:
  name: control
  namespace: vle7
  labels: { app.kubernetes.io/part-of: vle7, vle7/role: control, vle7/name: control }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { vle7/name: control }
  template:
    metadata:
      labels: { app.kubernetes.io/part-of: vle7, vle7/role: control, vle7/name: control }
    spec:
      serviceAccountName: vle7-control
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          env:
            - { name: ROLE, value: control }
            - { name: PORT, value: "3000" }
            - { name: NODE_ENV, value: production }
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
          envFrom:
            - secretRef: { name: vle7-secrets }
          ports: [{ containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /healthz, port: 3000 }, periodSeconds: 2, failureThreshold: 2 }
          livenessProbe: { httpGet: { path: /livez, port: 3000 }, periodSeconds: 10, failureThreshold: 3 }
          resources:
            requests: { cpu: 20m, memory: 48Mi }
            limits: { cpu: 300m, memory: 160Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: control
  namespace: vle7
spec:
  type: NodePort
  selector: { vle7/name: control }
  ports:
    - { port: 3000, targetPort: 3000, nodePort: 30090 }
