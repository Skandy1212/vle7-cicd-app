        "name": "shard",
        "label": "Shard",
        "type": "query",
        "datasource": {
         "type": "prometheus",
         "uid": "prometheus"
        },
        "query": {
         "query": "label_values(vle7_records, shard)",
         "refId": "shards"
        },
        "definition": "label_values(vle7_records, shard)",
        "refresh": 2,
        "includeAll": true,
        "multi": true,
        "allValue": ".*",
        "current": {
         "selected": true,
         "text": [
          "All"
         ],
         "value": [
          "$__all"
         ]
        },
        "sort": 1
       }
      ]
     },
     "panels": [
      {
       "id": 1,
       "title": "Records",
       "type": "stat",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 5,
        "h": 4
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum(vle7_records{shard=~\"$shard\"})",
         "instant": true,
         "range": false,
