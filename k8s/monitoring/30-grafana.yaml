# Grafana: the dashboard UI. Datasource and dashboard are provisioned from ConfigMaps, so nothing is clicked together by hand.
# Admin password comes from a Secret you create once (see README): kubectl -n monitoring create secret generic grafana-admin --from-literal=admin-password=...
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-provisioning, namespace: monitoring }
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc:9090
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: vle7
        type: file
        disableDeletion: true
        options: { path: /var/lib/grafana/dashboards }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-dashboards, namespace: monitoring }
data:
  vle7-overview.json: |
    {
     "uid": "vle7-overview",
     "title": "VLE 7 - Campus Records on Kubernetes",
     "tags": [
      "vle7"
     ],
     "timezone": "browser",
     "schemaVersion": 39,
     "version": 1,
     "refresh": "10s",
     "time": {
      "from": "now-30m",
      "to": "now"
     },
     "panels": [
      {
       "id": 1,
       "title": "Pods ready",
       "type": "stat",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum(kube_pod_status_ready{namespace=\"vle7\",condition=\"true\"})",
         "legendFormat": "ready"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "red",
            "value": null
           },
           {
            "color": "green",
            "value": 1
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {},
       "description": "Pods that pass their readiness probe right now."
      },
      {
       "id": 2,
       "title": "Pods NOT ready",
       "type": "stat",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 6,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "targets": [
        {
         "refId": "A",
         "expr": "count(kube_pod_status_ready{namespace=\"vle7\",condition=\"false\"} == 1) or vector(0)",
         "legendFormat": "not ready"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "red",
            "value": 1
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {}
      },
      {
       "id": 3,
       "title": "Container restarts (total)",
       "type": "stat",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 12,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"vle7\"})",
         "legendFormat": "restarts"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "orange",
            "value": 1
           },
           {
            "color": "red",
            "value": 5
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {},
       "description": "Restarts since the pods were created. Goes up when a container crashes or fails its liveness probe."
      },
      {
       "id": 4,
       "title": "Scrape targets up",
       "type": "stat",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 18,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum(up{job=\"vle7-pods\"})",
         "legendFormat": "app pods scraped"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "options": {},
       "description": "How many app pods Prometheus is successfully collecting /metrics from."
      },
      {
       "id": 5,
       "title": "Request rate by role",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 0,
        "y": 4,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (role) (rate(vle7_http_requests_total[1m]))",
         "legendFormat": "{{role}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "reqps"
        },
        "overrides": []
       },
       "options": {},
       "description": "Requests per second served by each tier (gateway, shard, backup, control), including health probes."
      },
      {
       "id": 6,
       "title": "Errors (5xx) per second",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 12,
        "y": 4,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (role) (rate(vle7_http_requests_total{code=~\"5..\"}[1m]))",
         "legendFormat": "{{role}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "reqps"
        },
        "overrides": []
       },
       "options": {},
       "description": "Server errors. Flat zero is healthy; a spike during a deploy or a pod kill shows the impact."
      },
      {
       "id": 7,
       "title": "p95 latency of API calls",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 0,
        "y": 12,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "refId": "A",
         "expr": "histogram_quantile(0.95, sum by (le, role) (rate(vle7_http_request_duration_seconds_bucket{route=\"api\"}[2m])))",
         "legendFormat": "{{role}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "s"
        },
        "overrides": []
       },
       "options": {}
      },
      {
       "id": 8,
       "title": "Requests by route class",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 12,
        "y": 12,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (role, route) (rate(vle7_http_requests_total[1m]))",
         "legendFormat": "{{role}} / {{route}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "reqps"
        },
        "overrides": []
       },
       "options": {}
      },
      {
       "id": 9,
       "title": "Container restarts per pod",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 0,
        "y": 20,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "refId": "A",
         "expr": "kube_pod_container_status_restarts_total{namespace=\"vle7\"}",
         "legendFormat": "{{pod}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "options": {}
      },
      {
       "id": 10,
       "title": "Pod ready state (1 = ready)",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 12,
        "y": 20,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "refId": "A",
         "expr": "kube_pod_status_ready{namespace=\"vle7\",condition=\"true\"}",
         "legendFormat": "{{pod}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "options": {},
       "description": "Kill a shard from the control panel: its line drops to 0 and returns to 1 when self-healing finishes."
      },
      {
       "id": 11,
       "title": "Memory (working set) per pod",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 0,
        "y": 28,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"vle7\",container=\"app\"})",
         "legendFormat": "{{pod}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "bytes"
        },
        "overrides": []
       },
       "options": {}
      },
      {
       "id": 12,
       "title": "CPU per pod (cores)",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 12,
        "y": 28,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"vle7\",container=\"app\"}[1m]))",
         "legendFormat": "{{pod}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "options": {}
      }
