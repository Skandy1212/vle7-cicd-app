        "h": 4
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum(vle7_accounts{shard=~\"$shard\"})",
         "instant": true,
         "range": false,
         "legendFormat": "Accounts"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "decimals": 0
        },
        "overrides": []
       },
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ],
         "fields": "",
         "values": false
        },
        "colorMode": "none",
        "graphMode": "none",
        "textMode": "value"
       }
      },
      {
